<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simon Says Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="game-container">
    <header>
      <h1>Simon Says</h1>
      <h3 class="h3">Press any key to start</h3>
    </header>

    <div class="btn-container">
      <div class="grid-row">
        <div class="btn one" type="button" id="one"></div>
        <div class="btn two" type="button" id="two"></div>
      </div>
      <div class="grid-row">
        <div class="btn three" type="button" id="three"></div>
        <div class="btn four" type="button" id="four"></div>
      </div>
    </div>
    <button id="rules-btn" class="rules-btn">Rules</button> <!-- Changed id to avoid conflicts & added class -->
  </div>

  <!-- Rules Overlay -->
  <div class="rules-overlay" id="rules-overlay">
    <div class="rules-content">
      <h2>🎮 SIMON GAME – RULE BOOK</h2>

      <div class="rule-item">
        <span class="icon">▶️</span>
        <p>Press any key to start</p>
      </div>

      <div class="rule-item">
        <span class="icon">🎨</span>
        <p>Watch the color sequence carefully</p>
      </div>

      <div class="rule-item">
        <span class="icon">🖱️</span>
        <p>Repeat the same sequence by clicking buttons</p>
      </div>

      <div class="rule-item">
        <span class="icon">➕</span>
        <p>One new color is added every level</p>
      </div>

      <hr>

      <div class="rule-item danger">
        <span class="icon">❌</span>
        <p>Wrong click = Game Over</p>
      </div>

      <div class="rule-item">
        <span class="icon">🔁</span>
        <p>Press any key to restart</p>
      </div>

      <div class="good-luck">Good luck!</div>

      <button class="close-btn" id="close-rules">Got it!</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
