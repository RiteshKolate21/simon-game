<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>Simon Says Game</h2>
    <h3>Press any key to start the game</h3>

    <div class="btn-container">
      <div class="first-line">
        <div class="btn one" type="button">1</div>
        <div class="btn two" type="button">2</div>
      </div>

      <div class="second-line">
        <div class="btn three" type="button">3</div>
        <div class="btn four" type="button">4</div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
